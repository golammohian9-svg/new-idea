<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Earning App - Adexora</title>
    
    <!-- Tailwind CSS for Ultra-Premium Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adexora Script -->
    <script src="https://adexora.com/cdn/ads.js?id=1366"></script>

    <style>
        @keyframes meshGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .mesh-bg {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f172a);
            background-size: 400% 400%;
            animation: meshGradient 12s ease infinite;
        }
    </style>
</head>
<body class="mesh-bg min-h-screen text-white font-sans flex flex-col justify-between p-4 selection:bg-purple-500 selection:text-white">

    <!-- Header / Profile Section -->
    <header class="w-full max-w-md mx-auto bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-4 shadow-xl flex items-center gap-4">
        <img id="user-avatar" src="https://via.placeholder.com/150" alt="Profile" class="w-14 h-14 rounded-full border-2 border-purple-400 object-cover shadow-md">
        <div class="overflow-hidden">
            <h1 id="user-name" class="text-lg font-bold truncate">Loading...</h1>
            <p id="user-username" class="text-xs text-purple-300 truncate">@username</p>
            <span class="inline-block mt-1 px-2 py-0.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[10px] font-semibold rounded-full">Active User</span>
        </div>
    </header>

    <!-- Main Dashboard Card -->
    <main class="w-full max-w-md mx-auto my-auto space-y-4">
        <!-- Balance Card -->
        <div class="bg-gradient-to-br from-purple-900/40 to-slate-900/60 backdrop-blur-xl border border-purple-500/30 rounded-2xl p-6 shadow-2xl text-center relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-32 h-32 bg-purple-500/10 rounded-full blur-2xl"></div>
            <p class="text-xs uppercase tracking-widest text-purple-300 font-medium">Total Balance</p>
            <h2 id="user-balance" class="text-4xl font-black mt-2 text-transparent bg-clip-text bg-gradient-to-r from-white via-purple-200 to-purple-400">$0.00</h2>
        </div>

        <!-- Ad Limit & Progress Section -->
        <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-5 shadow-lg space-y-3">
            <div class="flex justify-between text-sm font-medium">
                <span class="text-gray-300">Daily Ad Limit</span>
                <span id="ad-count-text" class="text-purple-300">0 / 20</span>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-slate-800/80 rounded-full h-3 overflow-hidden p-0.5 border border-white/5">
                <div id="ad-progress-bar" class="bg-gradient-to-r from-purple-500 to-indigo-500 h-full rounded-full transition-all duration-500" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Watch Ad Button -->
        <button onclick="watchAdexoraAd()" id="watch-btn" class="w-full py-4 px-6 rounded-2xl font-bold text-base bg-gradient-to-r from-purple-600 via-indigo-600 to-purple-700 hover:from-purple-500 hover:to-indigo-500 active:scale-[0.98] transition-all shadow-xl shadow-purple-900/30 border border-purple-400/30 flex items-center justify-center gap-2">
            <span>📺</span> Watch Adexora Ad & Earn
        </button>
    </main>

    <!-- Footer Status / Notice -->
    <footer class="w-full max-w-md mx-auto text-center py-2">
        <p id="status-msg" class="text-xs text-gray-400">Connected to Firebase Realtime Database.</p>
    </footer>

    <!-- Firebase SDKs & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set, update, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCuRKtaddB6HwCVKqK5tZNWGec9c4pDwik",
          authDomain: "hshs-54fc6.firebaseapp.com",
          databaseURL: "https://hshs-54fc6-default-rtdb.firebaseio.com",
          projectId: "hshs-54fc6",
          storageBucket: "hshs-54fc6.firebasestorage.app",
          messagingSenderId: "1043712197041",
          appId: "1:1043712197041:web:5a5839a5d57b330da8bd90",
          measurementId: "G-02V14M2RW2"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentUser = null;
        const MAX_DAILY_ADS = 20;
        const REWARD_PER_AD = 0.01;

        window.addEventListener('DOMContentLoaded', () => {
            const user = tg.initDataUnsafe?.user || {
                id: "test_user_123",
                first_name: "Test Developer",
                username: "dev_user",
                photo_url: "https://via.placeholder.com/150"
            };

            currentUser = user;
            initializeUserData(user);
        });

        async function initializeUserData(user) {
            const userRef = ref(db, `users/${user.id}`);
            
            try {
                const snapshot = await get(userRef);
                
                document.getElementById('user-name').innerText = user.first_name || "User";
                document.getElementById('user-username').innerText = `@${user.username || 'unknown'}`;
                if (user.photo_url) {
                    document.getElementById('user-avatar').src = user.photo_url;
                }

                const today = new Date().toISOString().split('T')[0];

                if (!snapshot.exists()) {
                    const initialData = {
                        telegramId: user.id,
                        firstName: user.first_name || "",
                        username: user.username || "",
                        balance: 0.00,
                        lastActiveDate: today,
                        adsWatchedToday: 0
                    };
                    await set(userRef, initialData);
                    updateUI(initialData);
                } else {
                    let userData = snapshot.val();
                    if (userData.lastActiveDate !== today) {
                        userData.adsWatchedToday = 0;
                        userData.lastActiveDate = today;
                        await update(userRef, { adsWatchedToday: 0, lastActiveDate: today });
                    }
                    updateUI(userData);
                }
            } catch (error) {
                console.error("Database connection error:", error);
                document.getElementById('status-msg').innerText = "Database sync error. Check rules.";
            }
        }

        function updateUI(data) {
            document.getElementById('user-balance').innerText = `$${Number(data.balance).toFixed(2)}`;
            const adsDone = data.adsWatchedToday || 0;
            document.getElementById('ad-count-text').innerText = `${adsDone} / ${MAX_DAILY_ADS}`;
            
            const percentage = (adsDone / MAX_DAILY_ADS) * 100;
            document.getElementById('ad-progress-bar').style.width = `${percentage}%`;
        }

        // Adexora Execution & Reward Logic
        window.watchAdexoraAd = async function() {
            if (!currentUser) {
                alert("User session not loaded yet.");
                return;
            }

            const userRef = ref(db, `users/${currentUser.id}`);
            
            try {
                const snapshot = await get(userRef);
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    if ((userData.adsWatchedToday || 0) >= MAX_DAILY_ADS) {
                        alert("You have reached your daily ad limit! Come back tomorrow.");
                        return;
                    }
                }
            } catch (err) {
                console.error("Limit check error", err);
            }

            const watchBtn = document.getElementById('watch-btn');
            watchBtn.disabled = true;
            watchBtn.innerText = "Loading Ad...";

            if (typeof window.showAdexora === 'function') {
                window.showAdexora()
                    .then(async () => {
                        await runTransaction(userRef, (currentData) => {
                            if (currentData) {
                                currentData.balance = (Number(currentData.balance) || 0) + REWARD_PER_AD;
                                currentData.adsWatchedToday = (Number(currentData.adsWatchedToday) || 0) + 1;
                            }
                            return currentData;
                        });

                        const updatedSnap = await get(userRef);
                        updateUI(updatedSnap.val());
                        
                        watchBtn.disabled = false;
                        watchBtn.innerHTML = "<span>📺</span> Watch Adexora Ad & Earn";
                        document.getElementById('status-msg').innerText = "Reward added successfully!";
                    })
                    .catch(e => {
                        console.error("Ad failed or skipped:", e);
                        watchBtn.disabled = false;
                        watchBtn.innerHTML = "<span>📺</span> Watch Adexora Ad & Earn";
                        document.getElementById('status-msg').innerText = "Ad closed or not available right now.";
                    });
            } else {
                alert("Adexora script failed to load. Please use GitHub Pages or Netlify instead of Blogger.");
                watchBtn.disabled = false;
                watchBtn.innerHTML = "<span>📺</span> Watch Adexora Ad & Earn";
            }
        };
    </script>
</body>
</html>
